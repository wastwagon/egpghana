name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: egp_user
          POSTGRES_PASSWORD: egp_dev_password_2026
          POSTGRES_DB: egp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U egp_user -d egp_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://egp_user:egp_dev_password_2026@localhost:5432/egp_db
      NEXTAUTH_SECRET: ci-nextauth-secret-change-me
      NEXTAUTH_URL: http://localhost:3456
      NEXT_PUBLIC_APP_URL: http://localhost:3456
      ADMIN_EMAIL: admin@egpghana.org
      ADMIN_PASSWORD: admin123
      E2E_ADMIN_EMAIL: admin@egpghana.org
      E2E_ADMIN_PASSWORD: admin123
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run db:seed-careers
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
